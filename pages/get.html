<!-- title: Get SlipMate -->
<!-- Sends iPhones to the App Store and Android phones to Google Play. One QR code for print (boat, business card). -->
<h1>Get SlipMate</h1>
<p class="muted">Taking you to the right store for your phone…</p>
<div class="stores">{{appleBadge}}{{googleBadge}}</div>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var apple = '{{appleHref}}', google = '{{googleHref}}';
  var go = /iPhone|iPad|iPod/i.test(ua) ? apple : /Android/i.test(ua) ? google : '';
  if (go && go !== '/') location.replace(go);
})();
</script>
