<!-- Layout for pages/share.png, the 1200x630 picture shown when someone shares a link to the site. Not published. To remake it, see README.md. -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Knewave;src:url(pages/fonts/Knewave_400Regular.ttf)}
@font-face{font-family:Barlow;src:url(pages/fonts/Barlow_600SemiBold.ttf);font-weight:600}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.c{position:relative;width:1200px;height:630px;background:#16212B url(pages/boat-bow.webp) 340px 70%/1150px auto no-repeat}
.c::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,27,36,1) 0%,rgba(17,27,36,1) 40%,rgba(17,27,36,.6) 54%,rgba(17,27,36,0) 70%,rgba(17,27,36,0) 100%)}
.t{position:absolute;left:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;color:#fff;width:640px}
.row{display:flex;align-items:center;gap:28px}
img{width:132px;height:132px;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
h1{font:400 112px/1 Knewave;margin:0;letter-spacing:1px}
p{font:600 42px/1.25 Barlow;margin:40px 0 0;color:#F6F1E8}
.u{font:600 26px Barlow;margin-top:36px;color:#9FD0EC}
</style></head>
<body><div class="c"><div class="t">
<div class="row"><img src="pages/icon.png"><h1>SlipMate</h1></div>
<p>Your boat. Always ready.<br>Wherever you are.</p>
<div class="u">underwayapps.com</div>
</div></div></body></html>
